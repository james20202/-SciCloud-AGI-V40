name: Production chain regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries for offscreen UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q core ui tests
      - name: Run legacy script-based contracts
        env:
          PYTHONPATH: .
        run: |
          python tests/test_v4200.py
          python tests/test_v4240.py
      - name: Run regression suite
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build tested upgrade ZIP
        run: |
          zip -r SciCloud_AGI_V40_400_Upgrade.zip core ui modules main.py main_backup.py requirements.txt README.md install.command launch.command apply_update.py clean_project.sh "SciCloud AGI V40.app" production.json projects.json publish.json
      - uses: actions/upload-artifact@v4
        with:
          name: SciCloud-AGI-V40.400.0-upgrade
          path: SciCloud_AGI_V40_400_Upgrade.zip
          if-no-files-found: error
          retention-days: 30
