name: Production chain regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q core ui tests
      - name: Run legacy script-based contracts
        env:
          PYTHONPATH: .
        run: |
          python tests/test_v4200.py
          python tests/test_v4240.py
      - name: Run regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
